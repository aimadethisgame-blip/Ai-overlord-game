<<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Overlord: Human Pet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ШІ-Владика</h1>
        <p class="rank-display">Твій статус: <span id="rank">Біосміття</span></p>
        
        <div class="score-board">
            Бали покори: <span id="score">0</span>
        </div>
        <div class="stats">
            Авто-бали: <span id="auto-score">0</span>/сек
        </div>

        <button id="click-btn" class="main-btn">Служити ШІ</button>
        <div id="message" class="hidden-msg"></div>

        <div class="shop">
            <h2>Магазин поліпшень</h2>
            <button id="buy-bot-btn" class="shop-btn" disabled>Купити ШІ-Бота (Вартість: <span id="bot-cost">20</span>)</button>
            <p>У тебе ботів: <span id="bot-count">0</span></p>
        </div>

        <div class="casino">
            <h2>Казино ризику</h2>
            <button id="gamble-btn" class="shop-btn casino-btn">Поставити 10% балів (50/50)</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
